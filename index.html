<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R Journal</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --sidebar-bg: #161b22;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-green: #238636;
            --accent-red: #da3633;
            --text-muted: #8b949e;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        sidebar {
            width: 240px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .logo { font-size: 1.2rem; font-weight: bold; color: #fff; margin-bottom: 20px; }
        .nav-item { padding: 10px; color: var(--text-muted); cursor: pointer; border-radius: 6px; text-decoration: none; display: block; }
        .nav-item.active, .nav-item:hover { background-color: rgba(255,255,255,0.05); color: #fff; }
        
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .dashboard-header h1 { margin: 0; font-size: 1.5rem; color: #fff; }
        .dashboard-header p { margin: 5px 0 0; color: var(--text-muted); font-size: 0.9rem; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
        }
        .stat-title { font-size: 0.8rem; color: var(--text-muted); }
        .stat-value { font-size: 1.3rem; font-weight: bold; color: #fff; margin-top: 5px; }

        .analytics-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .filters-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .filters-bar select {
            background: #0d1117;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .chart-placeholder {
            height: 180px;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.1);
        }

        .recent-trades-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }
        th { color: var(--text-muted); font-weight: 500; }
        
        .text-success { color: #3fb950; }
        .text-danger { color: #f85149; }
    </style>
</head>
<body>

    <sidebar>
        <div class="logo">R JOURNAL</div>
        <a class="nav-item active">Dashboard</a>
        <a class="nav-item">Add Trade</a>
        <a class="nav-item">Trades</a>
        <a class="nav-item">Analytics</a>
        <a class="nav-item">Strategies</a>
    </sidebar>

    <div class="main-content">
        <div class="dashboard-header">
            <h1>Dashboard</h1>
            <p>Your trading performance at a glance</p>
        </div>

        <!-- بطاقات الإحصائيات العلوية -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title">Total Trades</div>
                <div class="stat-value" id="val-total-trades">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total R</div>
                <div class="stat-value" id="val-total-r">0.0R</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Win Rate</div>
                <div class="stat-value" id="val-win-rate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Wins / Losses</div>
                <div class="stat-value" id="val-win-loss">0/0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">Total PnL ($)</div>
                <div class="stat-value" id="val-total-pnl">$0.00</div>
            </div>
        </div>

        <!-- قسم نظرة عامة على الأداء + الفلاتر المنفصلة -->
        <div class="analytics-section">
            <div class="filters-bar">
                <!-- فلتر نوع العرض (R أو PnL) -->
                <select id="metric-filter" onchange="updateDashboard()">
                    <option value="R">Performance (R)</option>
                    <option value="PnL">Total PnL ($)</option>
                </select>

                <!-- فلتر الـ RR المنفصل -->
                <select id="rr-filter" onchange="updateDashboard()">
                    <option value="All">RR Filter: All</option>
                    <option value="positive">Positive RR (>0)</option>
                    <option value="negative">Negative RR (<=0)</option>
                </select>

                <!-- فلتر الفترة الزمنية الجديد -->
                <select id="time-filter" onchange="updateDashboard()">
                    <option value="all">All Time</option>
                    <option value="month">This Month</option>
                    <option value="week">This Week</option>
                </select>
            </div>

            <!-- الرسم البياني للأداء (Performance Overview) -->
            <div class="chart-placeholder" id="performance-chart-box">
                Performance Overview Chart (Active Data Displayed)
            </div>
        </div>

        <!-- جدول الصفقات الأخيرة (Recent Trades) -->
        <div class="recent-trades-card">
            <h3 style="margin-top:0; font-size:1rem; color:#fff;">Recent Trades</h3>
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Symbol</th>
                        <th>Setup</th>
                        <th>R</th>
                        <th>PnL</th>
                        <th>Result</th>
                    </tr>
                </thead>
                <tbody id="recent-trades-tbody">
                    <!-- سيتم تعبئة البيانات ديناميكياً هنا -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // دالة مساعدة لتصحيح مشكلة إزاحة التاريخ (تجنب مشكلة الـ UTC والتاريخ السابق)
        function getLocalDateString(dateInput) {
            const d = dateInput ? new Date(dateInput) : new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // جلب الصفقات (توليد بيانات تجريبية لو كانت الذاكرة فارغة لتشاهد النتيجة فوراً)
        function getStoredTrades() {
            let trades = JSON.parse(localStorage.getItem('trading_journal_trades'));
            if (!trades) {
                // بيانات تجريبية افتراضية للتأكد من عمل الجدول والرسوم البيانية
                trades = [
                    { date: '2026-09-15', symbol: 'EURUSD', setup: 'Breakout', r: 2.0, pnl: 200, result: 'Win' },
                    { date: '2026-09-14', symbol: 'NQ', setup: 'Reversal', r: -1.0, pnl: -100, result: 'Loss' },
                    { date: '2026-09-10', symbol: 'GC', setup: 'Trend', r: 1.0, pnl: 100, result: 'Win' }
                ];
                localStorage.setItem('trading_journal_trades', JSON.stringify(trades));
            }
            return trades;
        }

        function updateDashboard() {
            const trades = getStoredTrades();
            const metric = document.getElementById('metric-filter').value;
            const rrFilter = document.getElementById('rr-filter').value;
            const timeFilter = document.getElementById('time-filter').value;

            // تطبيق فلاتر التاريخ والـ RR
            let filtered = trades.filter(t => {
                // تصفية الـ RR
                if (rrFilter === 'positive' && t.r <= 0) return false;
                if (rrFilter === 'negative' && t.r > 0) return false;

                // تصفية الفترة الزمنية
                if (timeFilter !== 'all') {
                    const tDate = new Date(t.date);
                    const now = new Date();
                    if (timeFilter === 'month') {
                        if (tDate.getMonth() !== now.getMonth() || tDate.getFullYear() !== now.getFullYear()) return false;
                    } else if (timeFilter === 'week') {
                        const diffTime = Math.abs(now - tDate);
                        const diffDays = diffTime / (1000 * 60 * 60 * 24);
                        if (diffDays > 7) return false;
                    }
                }
                return true;
            });

            // حساب الإحصائيات
            const totalTrades = filtered.length;
            let totalR = filtered.reduce((acc, curr) => acc + (curr.r || 0), 0);
            let totalPnL = filtered.reduce((acc, curr) => acc + (curr.pnl || 0), 0);
            let wins = filtered.filter(t => (t.result === 'Win' || t.r > 0)).length;
            let losses = totalTrades - wins;
            let winRate = totalTrades > 0 ? Math.round((wins / totalTrades) * 100) : 0;

            // تحديث البطاقات العلوية
            document.getElementById('val-total-trades').innerText = totalTrades;
            document.getElementById('val-total-r').innerText = (totalR >= 0 ? '+' : '') + totalR.toFixed(1) + 'R';
            document.getElementById('val-win-rate').innerText = winRate + '%';
            document.getElementById('val-win-loss').innerText = `${wins}/${losses}`;
            document.getElementById('val-total-pnl').innerText = (totalPnL >= 0 ? '$' : '-$') + Math.abs(totalPnL).toFixed(2);

            // تحديث نص صندوق الأداء بناءً على الفلتر المختار
            const chartBox = document.getElementById('performance-chart-box');
            chartBox.innerHTML = `Displaying Performance by <b>${metric}</b> | Filtered Count: <b>${totalTrades} trades</b>`;

            // تحديث وعرض جدول الصفقات الأخيرة (Recent Trades)
            const tbody = document.getElementById('recent-trades-tbody');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">No trades found for this filter</td></tr>`;
                return;
            }

            // ترتيب الصفقات من الأحدث للأقدم
            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            filtered.forEach(trade => {
                const row = document.createElement('tr');
                const isWin = trade.result === 'Win' || trade.r > 0;
                const cls = isWin ? 'text-success' : 'text-danger';

                row.innerHTML = `
                    <td>${trade.date}</td>
                    <td>${trade.symbol || '-'}</td>
                    <td>${trade.setup || '-'}</td>
                    <td class="${cls}">${trade.r > 0 ? '+' + trade.r + 'R' : trade.r + 'R'}</td>
                    <td class="${cls}">$${trade.pnl ? trade.pnl.toFixed(2) : '0.00'}</td>
                    <td><span class="${cls}">${trade.result || (isWin ? 'Win' : 'Loss')}</span></td>
                `;
                tbody.appendChild(row);
            });
        }

        // تشغيل التحديث عند فتح الصفحة
        document.addEventListener('DOMContentLoaded', updateDashboard);
    </script>
</body>
</html>
